plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "com.github.Draylar.omega-config") {
            details.useTarget("dev.draylar.omega-config:omega-config-base:1.4.0+1.20.1")
            details.because("Override legacy omega-config from JitPack to modern release")
        }
        if (details.requested.group == "com.jamieswhiteshirt"
            && details.requested.name == "reach-entity-attributes") {
            details.useTarget("com.jamieswhiteshirt:reach-entity-attributes:${project.rea_version}")
            details.because("Force override reach entity attributes")
        }
    }
}


repositories {
    // Fabric
    maven { url "https://maven.fabricmc.net/" }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    // Modrinth (e.g. Modern Industrialization)
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    // CurseMaven (e.g. WTHIT)
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    // Bai Maven (e.g. Megane, Bad Packets)
    maven { url "https://maven.bai.lol" }

    // Shedaniel (e.g. Cloth Config, Architectury)
    maven {
        name "REI"
        url "https://maven.shedaniel.me/"
        content {
            includeGroup "me.shedaniel"
            includeGroup "me.shedaniel.cloth"
            includeGroup "dev.architectury"
        }
    }

    // Terraformers (e.g. ModMenu, EMI)
    maven {
        url "https://maven.terraformersmc.com"
        //content {
        //    includeGroup "com.terraformersmc"
        //    includeGroup "dev.emi"
        //}
    }

    // Jamie’s Whiteshirt (e.g. Reach Entity Attributes)
    maven {
        url "https://maven.jamieswhiteshirt.com/libs-release/"
        content {
            includeGroup "com.jamieswhiteshirt"
        }
    }

    // Ladysnake (e.g. PlayerAbilityLib)
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
        content {
            includeGroup 'io.github.ladysnake'
            includeGroupByRegex 'io\\.github\\.onyxstudios.*'
        }
    }

    maven {
        url "https://maven.draylar.dev/releases"
    }

    // Jitpack (e.g. Omega Config, Magna)
    maven { url 'https://jitpack.io' }

    // Resourceful (e.g. Athena)
    maven {
        url "https://maven.teamresourceful.com/repository/maven-public/"
        content {
            includeGroup "earth.terrarium.athena"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Omega Config
    include("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-item-group-api-v1'
    }

    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-item-group-api-v1'
    }

    modImplementation("dev.draylar.omega-config:omega-config-base:1.4.0+1.20.1")

    // dev modmenu
    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}") {
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-item-group-api-v1'
    }

    //modApi include("com.github.Draylar:omega-config:${project.omega_config_version}") {
    //    transitive = false
    //}
    modApi("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}") {
        //exclude group: 'net.fabricmc.fabric-api', module: 'fabric-item-group-api-v1'
    }
    modImplementation("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}") {
        //exclude group: 'net.fabricmc.fabric-api', module: 'fabric-item-group-api-v1'
    }

    // Megane
    modImplementation("lol.bai.megane:megane-api:${project.megane_version}") {
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-item-group-api-v1'
    }
    //modRuntimeOnly("lol.bai.megane:megane-runtime:${project.megane_version}") {
        //exclude group: 'net.fabricmc.fabric-api', module: 'fabric-item-group-api-v1'
    //}

    // Bad Packets
    modRuntimeOnly("lol.bai:badpackets:fabric-${project.badpackets_version}") {
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-item-group-api-v1'
    }

    // Modern Industrialization
    modImplementation("maven.modrinth:modern-industrialization:${project.mi_version}") {
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-item-group-api-v1'
    }

    // Player Ability Lib
    modRuntimeOnly("io.github.ladysnake:PlayerAbilityLib:${project.pal_version}") {
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-item-group-api-v1'
    }

    // WTHIT
    modImplementation("curse.maven:wthit-440979:5073536") {
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-item-group-api-v1'
    }

    // Mod Menu
    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}") {
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-item-group-api-v1'
    }

    // Magna 1.6.2-1.17
    modImplementation("dev.draylar:magna:${project.magna_version}") {
        exclude(group: "io.github.prospector")
        exclude(group: "me.shedaniel.cloth")
        exclude(group: "net.fabricmc.fabric-api")
        exclude group: 'com.github.Draylar.omega-config', module: 'omega-config-base'
    }

    // Reborn Energy
    include modApi("teamreborn:energy:${project.energy_version}") {
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-item-group-api-v1'
        exclude group: "net.fabricmc", module: "fabric-loader"
    }
    modImplementation "curse.maven:reborncore-237903:4708961"
    modImplementation "curse.maven:techreborn-233564:4708962"

    // Athena
    //modImplementation("earth.terrarium.athena:athena-fabric-${project.minecraft_version}:${project.athena_version}") {
        //exclude group: 'net.fabricmc.fabric-api', module: 'fabric-item-group-api-v1'
    //}

    // dev Reach Entity Attributes for testing tools with extended reach (or players)
    modImplementation("com.jamieswhiteshirt:reach-entity-attributes:${project.rea_version}") {
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-item-group-api-v1'
    }
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    archivesBaseName = project.archives_base_name
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        // Define publish repositories here
    }
}
